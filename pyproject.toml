[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audish"
version = "0.1.0"
description = "Excel-in → Excel-out audition scheduler for Juilliard"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "openpyxl>=3.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
]

[tool.setuptools.packages.find]
include = ["audish*"]
exclude = ["tests*", "schools*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
audish = "audish.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

