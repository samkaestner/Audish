appId: com.audition.scheduler
productName: Audition Scheduler
copyright: Copyright © 2025

directories:
  buildResources: build
  output: dist

files:
  - main/**/*
  - renderer/dist/**/*
  - package.json
  - "!main/*.ts"
  - "!renderer/src/**/*"
  - "!renderer/node_modules/**/*"
  - "!node_modules/**/*"

extraMetadata:
  main: main/main.js

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: null
  entitlementsInherit: null

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

