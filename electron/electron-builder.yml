appId: com.audition.scheduler
productName: Audition Scheduler
copyright: Copyright © 2025

directories:
  buildResources: build
  output: dist

files:
  - main/**/*
  - renderer/dist/**/*
  - package.json
  - "!main/*.ts"
  - "!renderer/src/**/*"
  - "!renderer/node_modules/**/*"
  - "!node_modules/**/*"

# Include school configuration files (shared across platforms)
extraResources:
  - from: ../schools
    to: schools
    filter:
      - "**/*.yaml"
      - "**/*.yml"

extraMetadata:
  main: main/main.js

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: null
  entitlementsInherit: null
  # Include the bundled Python executable for macOS
  extraResources:
    - from: resources/audish-cli
      to: audish-cli

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  # Include the bundled Python executable for Windows
  extraResources:
    - from: resources/audish-cli.exe
      to: audish-cli.exe

linux:
  target:
    - AppImage
    - deb
  category: Utility
  # Include the bundled Python executable for Linux
  extraResources:
    - from: resources/audish-cli
      to: audish-cli

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
